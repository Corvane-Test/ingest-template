apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream
  labels:
    app: upstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upstream
  template:
    metadata:
      labels:
        app: upstream
    spec:
      containers:
        - name: upstream
          image: ghcr.io/jose1522/rategrid-mock@sha256:db4f44834ce1ea0f72d6a90e09afe2b4acdc28095196b1602fa47b73543413e7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PROFILE
              value: p0
          readinessProbe:
            httpGet:
              path: /stats
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: upstream
  labels:
    app: upstream
spec:
  type: ClusterIP
  selector:
    app: upstream
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: upstream-stats
  labels:
    app: upstream
spec:
  type: NodePort
  selector:
    app: upstream
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
