apiVersion: v1
kind: Pod
metadata:
  name: ingest
  labels:
    app: ingest
spec:
  containers:
    - name: ingest
      image: ingest:latest
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8000
      env:
        - name: DATABASE_URL
          value: postgresql://ingest:ingest@postgres:5432/ingest
        - name: UPSTREAM_URL
          value: http://upstream:8080
        - name: LOG_LEVEL
          value: INFO
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
