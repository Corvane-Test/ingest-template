apiVersion: v1
kind: Pod
metadata:
  name: ingest
  labels:
    app: ingest
spec:
  containers:
    - name: ingest
      image: ingest:latest
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8000
      env:
        - name: DATABASE_URL
          value: postgresql://ingest:ingest@postgres:5432/ingest
        - name: UPSTREAM_URL
          value: http://upstream:8080
        - name: UPSTREAM_TIMEOUT
          value: "5"
        # shared Redis, managed by the platform team
        - name: CACHE_URL
          value: redis://redis.platform.svc:6379/0
        - name: LOG_LEVEL
          value: INFO
        - name: OTEL_SERVICE_NAME
          value: ingest
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://lgtm:4317
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "15000"
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_traceidratio
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.01"
      # restart the container if the app stops responding
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 1
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
