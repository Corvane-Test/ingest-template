apiVersion: v1
kind: Pod
metadata:
  name: ingest
  labels:
    app: ingest
spec:
  containers:
    - name: ingest
      image: ingest:latest
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8000
      env:
        - name: DATABASE_URL
          value: postgresql://ingest:ingest@postgres:5432/ingest
        - name: UPSTREAM_URL
          value: http://upstream:8080
        - name: UPSTREAM_TIMEOUT
          value: "5"
        - name: LOG_LEVEL
          value: INFO
      # restart the container if the app stops responding
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 1
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
