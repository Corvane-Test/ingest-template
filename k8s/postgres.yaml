apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app: postgres
data:
  001-schema.sql: |
    CREATE TABLE IF NOT EXISTS events (
        id          bigserial PRIMARY KEY,
        event_id    text NOT NULL,
        customer    varchar(32) NOT NULL,
        payload     jsonb NOT NULL,
        enriched    jsonb,
        created_at  timestamptz NOT NULL DEFAULT now()
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.6
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: ingest
            - name: POSTGRES_PASSWORD
              value: ingest
            - name: POSTGRES_DB
              value: ingest
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ingest", "-d", "ingest"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 256Mi
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
