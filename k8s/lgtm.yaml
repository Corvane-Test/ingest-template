apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  labels:
    app: lgtm
data:
  ingest.yaml: |
    apiVersion: 1
    providers:
      - name: "Ingest"
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /otel-lgtm/grafana/conf/provisioning/dashboards/ingest-overview.json
          foldersFromFilesStructure: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels:
    app: lgtm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.35.0
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /otel-lgtm/grafana/conf/provisioning/dashboards/ingest-overview.json
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: dashboard-json
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/ingest-overview.json
              subPath: ingest-overview.json
            - name: dashboard-provider
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/ingest.yaml
              subPath: ingest.yaml
      volumes:
        - name: dashboard-json
          configMap:
            name: grafana-dashboard-ingest
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  labels:
    app: lgtm
spec:
  selector:
    app: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: lgtm
spec:
  type: NodePort
  selector:
    app: lgtm
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
